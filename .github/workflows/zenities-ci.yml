name: zenities CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]
  create:
    tags:
      - 'v*'

jobs:
  lint:
    name: ShellCheck Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          # Melakukan audit pada semua script .sh
          find . -name "*.sh" | xargs shellcheck -e SC1091,SC2024

  test-build:
    name: Arch Linux Installation Test
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # Dibutuhkan untuk beberapa operasi systemd/chattr
    steps:
      - uses: actions/checkout@v4

      - name: System Initialization
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo stow shellcheck

      - name: Setup Test User
        run: |
          # Makepkg tidak bisa berjalan sebagai root, kita buat user dummy
          useradd -m tester
          echo "tester ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R tester:tester ./

      - name: Execute Zenities Installation
        run: |
          # Kita jalankan script dalam environment bersih
          # GITHUB_ACTIONS=true bisa digunakan di dalam script untuk skip reboot
          su tester -c "export GITHUB_ACTIONS=true && chmod +x install.sh && ./install.sh"
        
      - name: Idempotency Check
        run: |
          # Menjalankan script kedua kali untuk memastikan tidak ada error saat package sudah ada
          su tester -c "export GITHUB_ACTIONS=true && ./install.sh"

  release:
    name: GitHub Release
    needs: test-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Archive
        run: tar -cvzf zenities-dotfiles.tar.gz .config scripts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: zenities-dotfiles.tar.gz
